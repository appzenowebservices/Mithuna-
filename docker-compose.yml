# Frontend for agent.appzenowebservices.com
# Caddy (already configured) routes the domain here:
#   reverse_proxy appzeno-agent:3000
# Service name MUST stay `appzeno-agent` so Caddy's DNS resolves.
# No ports published: Caddy reaches it over the shared `web` network.
services:
  appzeno-agent:
    build: .
    image: mithuna
    container_name: appzeno-agent
    restart: unless-stopped
    environment:
      # host:port of the sibling backend containers on the `web` network
      PAPERCLIP_UPSTREAM: "appzeno-agent-panel:3100"
      HERMES_UPSTREAM: "hermes:8765"
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  web:
    external: true
